name: Bootstrap Kubernetes image

# One-time migration bootstrap retained only for an explicit manual rerun.
# Normal releases use staging.yml and production.yml.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source SHA to rebuild through staging and production
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  staging:
    uses: doxa-innovations/.github/.github/workflows/doxa-container-build.yml@main
    with:
      source_sha: ${{ inputs.source_sha }}
      environment: staging
      image: ghcr.io/doxa-innovations/lhf-ethiopia
      use_infisical: false

  production:
    needs: staging
    uses: doxa-innovations/.github/.github/workflows/doxa-container-build.yml@main
    with:
      source_sha: ${{ inputs.source_sha }}
      environment: production
      image: ghcr.io/doxa-innovations/lhf-ethiopia
      use_infisical: false
